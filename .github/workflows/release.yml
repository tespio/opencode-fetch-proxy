name: Release

# Why this workflow no longer publishes on every tag:
#
# It originally ran `npm publish` on each `v*` tag using npm trusted publishing (OIDC), which needs
# a one-time Trusted Publisher configuration on the npm package page. Until that exists, npm rejects
# the OIDC exchange, the publish job exits 1 -- and every tag push mails the owner a failure.
# A workflow guaranteed to fail is worse than no workflow.
#
# So tags now only VERIFY. Publishing is a deliberate manual action that also checks the registry
# state first and fails with a link instead of a bare ENEEDAUTH.
#
# To publish:
#   1. One-time: configure the trusted publisher
#        https://www.npmjs.com/package/opencode-fetch-proxy/settings
#        -> Trusted Publisher -> GitHub Actions
#           organization/user : tespio
#           repository        : opencode-fetch-proxy
#           workflow filename : release.yml
#           environment       : (leave blank)
#   2. Actions -> Release -> Run workflow -> tag_to_publish = v1.0.4
#
# Or skip CI entirely and publish locally:  npm publish --access public
#
# The floating `v1` tag: this workflow listens for full version tags only, so moving `v1` does
# not start a run. That matters because `v1` is re-pointed at every release, and a run comparing it
# against package.json would fail every time.

on:
  push:
    tags:
      # Full version tags only. The floating `v1` tag is moved on every release by design, so
      # including it here both duplicated every run and failed one of them: the version check
      # compares the tag against package.json, and "1" never equals "1.0.4". Since this workflow is
      # skipped entirely, the version check no longer needs to special-case a moving tag.
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag_to_publish:
        description: "Tag to publish to npm (e.g. v1.0.4). Leave empty to verify only."
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check syntax
        run: node --check index.js

      # OpenCode skips a plugin whose exports are the wrong shape and reports nothing, so fail here
      # rather than shipping a module that silently does nothing.
      - name: Check the export shape OpenCode requires
        run: |
          node -e '
            import("./index.js").then((m) => {
              const keys = Object.keys(m);
              console.log("exports: " + keys.join(", "));
              for (const k of keys) {
                const v = m[k];
                if (!(typeof v === "function" || (v && typeof v.server === "function"))) {
                  console.error("export " + k + " is not a function or {server}");
                  process.exit(1);
                }
              }
              if (!m.default || typeof m.default.server !== "function") {
                console.error("default export must expose server()");
                process.exit(1);
              }
              if (!m.default.id) {
                console.error("default export must expose id (required for file plugins)");
                process.exit(1);
              }
              console.log("export shape OK");
            }).catch((e) => { console.error(e); process.exit(1); });
          '

      # When a specific tag is being published, build from that tag, not from the branch.
      - name: Check out the tag being published
        if: inputs.tag_to_publish != ''
        run: |
          git fetch --depth=1 origin "refs/tags/${{ inputs.tag_to_publish }}:refs/tags/${{ inputs.tag_to_publish }}"
          git checkout "refs/tags/${{ inputs.tag_to_publish }}"

      # A tag must never publish a version other than its own.
      - name: Version matches
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [ -n "${{ inputs.tag_to_publish }}" ]; then
            EXPECTED="${{ inputs.tag_to_publish }}"
          else
            EXPECTED="$GITHUB_REF_NAME"
          fi
          EXPECTED=${EXPECTED#v}
          echo "package.json=$PKG expected=$EXPECTED"
          [ "$PKG" = "$EXPECTED" ] || { echo "::error::version mismatch"; exit 1; }

      - name: Show what would be published
        run: npm pack --dry-run

  publish:
    # Manual only. This is what stops the failure mail.
    if: github.event_name == 'workflow_dispatch' && inputs.tag_to_publish != ''
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Show registry and trusted-publisher state
        run: |
          NAME=$(node -p "require('./package.json').name")
          echo "package : $NAME"
          echo "registry: $(npm view "$NAME" version 2>/dev/null || echo '<not published yet>')"
          echo "trusted publisher must exist at:"
          echo "  https://www.npmjs.com/package/$NAME/settings"

      - name: Publish
        run: npm publish --access public

      - name: Release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ inputs.tag_to_publish }}" --generate-notes || true
